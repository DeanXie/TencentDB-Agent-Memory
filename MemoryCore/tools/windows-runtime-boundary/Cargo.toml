[package]
name = "windows-runtime-boundary"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Services"] }

[[bin]]
name = "cmg-runtime-boundary-test-service"
path = "src/main.rs"

[[bin]]
name = "cmg-runtime-boundary-ipc-child"
path = "src/bin/cmg-runtime-boundary-ipc-child.rs"
test = false
